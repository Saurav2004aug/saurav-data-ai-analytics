name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src app scripts tests
      - name: Build demo warehouse (DuckDB)
        run: PYTHONPATH=src python -m sqlanalyst.demo_db
      - name: Unit + guardrail tests
        run: pytest -q
      - name: Harness self-checks (no API key)
        run: make eval-offline
      # Optional: real benchmark on pushes to main when the secret is configured
      - name: Benchmark with Claude
        if: github.ref == 'refs/heads/main' && env.ANTHROPIC_API_KEY != ''
        run: PYTHONPATH=src python -m sqlanalyst.evaluate --strategies full --limit 40
