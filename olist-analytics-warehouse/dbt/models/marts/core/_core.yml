version: 2

models:
  - name: fct_orders
    description: >
      One row per order. Joins basket, payment, review and delivery facts. Revenue-type
      measures exclude canceled/unavailable orders downstream via `is_canceled`.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: order_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: order_value
        data_tests: [non_negative]
      - name: is_late
        description: 1 if delivered after the estimated date (+ late_grace_days), null if not delivered.
        data_tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: review_score
        data_tests:
          - is_between: {min_value: 1, max_value: 5}

  - name: fct_order_items
    description: One row per order line (incremental).
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: seller_id
        data_tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id

  - name: dim_customers
    description: One row per real customer (customer_unique_id), with lifetime metrics.
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
      - name: n_orders
        data_tests: [not_null]
      - name: lifetime_value
        data_tests: [non_negative]

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]
