name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src scripts app tests
      - name: Unit tests (estimators vs simulator ground truth)
        run: pytest -q
      - name: Smoke-test full pipeline offline
        run: python scripts/run_pipeline.py --source synthetic --bootstrap 20
